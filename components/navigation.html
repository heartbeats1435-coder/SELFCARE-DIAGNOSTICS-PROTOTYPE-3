<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu</title>
    <style>
        /* --- CSS for navigation.html --- */

        /* General resetting of default browser styles */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4; /* Temporary background color for the body */
        }

        /* The container for the entire navigation bar */
        .navbar {
            background-color: #333; /* Dark gray background */
            color: #fff;
            display: flex;
            justify-content: space-between; /* Puts Logo on left, links on right */
            align-items: center; /* Centers items vertically */
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: sticky; /* Keeps it at the top when scrolling */
            top: 0;
            z-index: 1000; /* Ensures it stays above other content */
        }

        /* Branding/Logo section */
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            padding: 15px 0;
        }

        /* The unordered list container for the links */
        .nav-links {
            list-style: none; /* Removes bullet points */
            margin: 0;
            padding: 0;
            display: flex; /* Makes the list items horizontal */
        }

        /* List items */
        .nav-links li {
            padding: 0;
        }

        /* The actual anchor links */
        .nav-links a {
            display: block; /* Important for padding/hover effect */
            color: #fff;
            text-decoration: none; /* Removes underline */
            padding: 20px 15px; /* Size of the clickable area */
            transition: background-color 0.3s ease; /* Smooth hover effect */
        }

        /* Styles the active or current page link */
        .nav-links a.active {
            background-color: #007bff; /* Blue background for active link */
            font-weight: bold;
        }

        /* Styles links on mouse hover */
        .nav-links a:hover {
            background-color: #555; /* Lighter gray on hover */
        }


        /* --- Mobile Responsiveness --- */
        /* Media query for screens smaller than 768px (tablets/phones) */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column; /* Stacks logo and links vertically */
                align-items: flex-start; /* Aligns content to the left */
                padding: 10px;
            }

            .navbar-brand {
                padding: 10px 0;
            }

            .nav-links {
                flex-direction: column; /* Stacks the links vertically */
                width: 100%; /* Links take full width */
            }

            .nav-links li {
                width: 100%;
            }

            .nav-links a {
                padding: 15px; /* Adjust padding for mobile tapping */
                width: 100%;
                text-align: left; /* Aligns mobile link text left */
                border-bottom: 1px solid #444; /* Add a subtle divider */
            }
        }
    </style>
</head>
<body>

    <!-- Main Navigation Bar -->
    <nav class="navbar">
        <!-- Logo/Branding Link -->
        <a href="index.html" class="navbar-brand">YourWebsite</a>

        <!-- Navigation Links List -->
        <ul class="nav-links">
            <!-- Add class="active" to the link for the current page -->
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!--
      This space below is temporary just to show the navigation bar.
      On your actual page, your main content goes here.
    -->
    <div style="padding: 20px;">
        <h2>Demo Content</h2>
        <p>This is where your page's main content would go.</p>
    </div>

</body>
</html>
