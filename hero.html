<!-- components/hero.html -->
<section class="hero-section py-5 text-center">
  <div class="container d-flex flex-column align-center">
    
    <!-- Hero Badge -->
    <span class="glass-pill mb-3">⚡ Smart Diagnostics & AI Insights</span>
    
    <!-- Main Tagline -->
    <h1 class="hero-title text-gradient mb-3">
      Precision Healthcare<br>At Your Doorstep
    </h1>
    
    <!-- Subtitle -->
    <p class="hero-subtitle text-muted mb-4" style="max-width: 580px;">
      Book home sample collections, access instant digital reports, and analyze your diagnostic history with AI assistance.
    </p>

    <!-- Quick Search Component -->
    <div class="hero-search-box w-100 mb-4" style="max-width: 540px;">
      <div class="glass-card p-2 d-flex align-center gap-2">
        <input 
          type="text" 
          id="heroSearchInput" 
          class="form-control border-0 bg-transparent text-white w-100 px-3" 
          placeholder="Search tests (e.g. Lipid, HbA1c, Vitamin D)..." 
          style="outline: none;"
        >
        <button class="btn btn-primary px-4" id="heroSearchBtn">Search</button>
      </div>
    </div>

    <!-- Quick Filter Tags -->
    <div class="d-flex align-center justify-center gap-2 flex-wrap">
      <span class="text-xs text-muted">Popular:</span>
      <a href="tests.html?q=Full+Body" class="glass-pill pill-sm text-xs">Full Body</a>
      <a href="tests.html?q=HbA1c" class="glass-pill pill-sm text-xs">HbA1c</a>
      <a href="tests.html?q=Thyroid" class="glass-pill pill-sm text-xs">Thyroid</a>
      <a href="tests.html?q=Vitamin+D" class="glass-pill pill-sm text-xs">Vitamin D3</a>
    </div>

  </div>
</section>
